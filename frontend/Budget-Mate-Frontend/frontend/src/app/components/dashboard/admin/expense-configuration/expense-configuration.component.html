<div class="expense-config-container">
  <div class="grid-layout">
    
    <div class="panel">
      <h2 class="section-title">Expense Distribution</h2>
      <div class="uniform-box chart-container">
        <div class="canvas-wrapper">
          <canvas #expenseChart></canvas>
          <div class="chart-center-text">
            <span class="total-label">Total Spent</span>
            <span class="total-amount">{{ totalSpentLabel }}</span>
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2 class="section-title">Configure Categories</h2>
      <div class="uniform-box category-card">
        <div class="list-header">
          <span>CATEGORY NAME</span>
          <span>STATUS & ACTION</span>
        </div>

        <div class="scroll-body">
          <div class="list-item" *ngFor="let cat of categories">
            <div class="category-info">
              <div class="category-icon-bg">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
                  <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                </svg>
              </div>
              <span class="category-label">{{ cat.name }}</span>
            </div>
            
            <div class="actions">
              <label class="toggle">
                <input type="checkbox" [checked]="cat.enabled" (change)="toggleCategory(cat)">
                <span class="slider"></span>
              </label>
              
              <button class="delete-btn" (click)="deleteCategory(cat)" title="Remove Category">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <div class="add-category-footer">
          <div class="input-group">
            <input 
              type="text" 
              placeholder="Add new category..." 
              [(ngModel)]="newCategoryName" 
              (keyup.enter)="addCategory()"
            >
            <button class="add-btn" (click)="addCategory()">
              <span>Add</span>
            </button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
