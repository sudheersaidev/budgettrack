<div class="container-fluid py-4 px-4 dashboard-bg">
  <div class="row g-4">
    
    <div class="col-12 col-md-6 col-xl-3">
      <div class="dashboard-card card-green h-100 border-0 shadow-sm p-4">
        <div class="d-flex align-items-center mb-3">
          <div class="icon-box me-3">
            <i class="bi bi-credit-card-2-front"></i>
          </div>
          <p class="card-title mb-0">Total Approved</p>
        </div>
        <h2 class="card-value mb-3">₹{{ totalExpenses | number }}</h2>
        <div class="progress progress-custom">
          <div class="progress-bar" role="progressbar" [style.width.%]="utilizationRate"></div>
        </div>
      </div>
    </div>

    <div class="col-12 col-md-6 col-xl-3">
      <div class="dashboard-card card-blue h-100 border-0 shadow-sm p-4">
        <div class="d-flex align-items-center mb-3">
          <div class="icon-box me-3">
            <i class="bi bi-currency-rupee"></i>
          </div>
          <p class="card-title mb-0">Total Budget</p>
        </div>
        <h2 class="card-value mb-3">₹{{ remainingBudget | number }}</h2>
        <div class="progress progress-custom">
          <div class="progress-bar" role="progressbar" [style.width.%]="100 - utilizationRate"></div>
        </div>
      </div>
    </div>

    <div class="col-12 col-md-6 col-xl-3">
      <div class="dashboard-card card-orange h-100 border-0 shadow-sm p-4">
        <div class="d-flex align-items-center mb-3">
          <div class="icon-box me-3">
            <i class="bi bi-pie-chart"></i>
          </div>
          <p class="card-title mb-0">Utilization Rate</p>
        </div>
        <h2 class="card-value mb-3">{{ utilizationRate }}%</h2>
        <div class="progress progress-custom">
          <div class="progress-bar" role="progressbar" [style.width.%]="utilizationRate"></div>
        </div>
      </div>
    </div>

    <div class="col-12 col-md-6 col-xl-3">
      <div class="dashboard-card card-teal h-100 border-0 shadow-sm p-4">
        <div class="d-flex align-items-center mb-3">
          <div class="icon-box me-3">
            <i class="bi bi-check-all"></i>
          </div>
          <p class="card-title mb-0">Approval Rate</p>
        </div>
        <h2 class="card-value mb-3">{{ approvalRate }}%</h2>
        <div class="approval-footer d-flex align-items-center gap-2 pt-3">
          <span class="count approved">{{ approvedCount }} Approved</span>
          <span class="divider">/</span>
          <span class="count rejected">{{ rejectedCount }} Rejected</span>
        </div>
      </div>
    </div>

  </div>
</div>
