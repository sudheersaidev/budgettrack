<app-navbar-employee 
  [userName]="userName" 
  [userRole]="userRole"
  (logoutNotify)="handleLogout()">
</app-navbar-employee>

<div class="min-vh-100 bg-light pb-5">
  
  <div class="container py-4">
    
    <div class="mb-3">
      <a routerLink="/employee" class="text-decoration-none text-muted d-inline-flex align-items-center gap-2 small fw-medium">
        <i class="bi bi-arrow-left"></i> Back to Dashboard
      </a>
    </div>

    <div class="card border-0 shadow-sm mb-4 overflow-hidden">
      <div class="card-body p-4">
        <div class="row align-items-center">
          <div class="col-auto">
            <div class="rounded-circle bg-primary text-white fw-bold d-flex align-items-center justify-content-center shadow"
                 style="width:90px; height:90px; font-size:32px; border: 4px solid #fff;">
              {{ userName.charAt(0) || 'U' }}
            </div>
          </div>
          
          <div class="col">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <h3 class="mb-1 fw-bold text-dark">{{userName}}</h3>
                <div class="d-flex flex-wrap gap-3">
                  <small class="text-muted"><i class="bi bi-fingerprint me-1"></i>ID: <strong>{{userId}}</strong></small>
                  <small class="text-muted"><i class="bi bi-building me-1"></i>Dept: <strong>{{userDepartment}}</strong></small>
                </div>
              </div>
              <span class="badge rounded-pill bg-info-subtle text-info px-3 py-2 border border-info-subtle">
                {{userRole}}
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="card border-0 shadow-sm p-2 mb-4">
      <ul class="nav nav-pills nav-fill gap-2">
        <li class="nav-item">
          <button class="nav-link py-2 d-flex align-items-center justify-content-center gap-2" 
            [class.active]="tabs === 'notifications'" (click)="tabs = 'notifications'">
            <i class="bi bi-bell-fill"></i> Notifications
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link py-2 d-flex align-items-center justify-content-center gap-2" 
            [class.active]="tabs === 'top-requests'" (click)="tabs = 'top-requests'">
            <i class="bi bi-wallet2"></i> Top-Up Requests
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link py-2 d-flex align-items-center justify-content-center gap-2" 
            [class.active]="tabs === 'edit-profile'" (click)="tabs = 'edit-profile'">
            <i class="bi bi-person-gear"></i> Edit Profile
          </button>
        </li>
      </ul>
    </div>

    <div class="card border-0 shadow-sm p-4">
      <div [ngSwitch]="tabs" class="tabSwitch">
        <div *ngSwitchCase="'notifications'" class="animate-fade">
          <app-notifications-employees></app-notifications-employees>
        </div>
        
        <div *ngSwitchCase="'top-requests'" class="animate-fade">
          <app-top-request-message></app-top-request-message>
        </div>

        <div *ngSwitchCase="'edit-profile'" class="animate-fade">
          <app-user-employee-management></app-user-employee-management>
        </div>
        
        <div *ngSwitchDefault class="text-center py-5 text-muted">
          <i class="bi bi-cursor me-2"></i> Select a tab to view content
        </div>
      </div>
    </div>

  </div> </div>
