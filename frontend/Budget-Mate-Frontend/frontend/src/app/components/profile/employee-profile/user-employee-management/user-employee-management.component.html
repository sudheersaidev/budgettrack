<div class="card border-0 shadow-sm">
  <div class="card-header bg-white py-3">
    <h6 class="mb-0 fw-bold text-dark">
      <i class="bi bi-person-gear me-2 text-primary"></i>Edit Account Details
    </h6>
  </div>
  <div class="card-body p-4">
    
    <form (ngSubmit)="onUpdate()">
      <div class="row g-4">
        <div class="col-md-6">
          <label class="form-label small fw-bold">Full Name</label>
          <input type="text" class="form-control" [(ngModel)]="user.name" name="name" required placeholder="Enter full name">
        </div>

        <div class="col-md-6">
          <label class="form-label small fw-bold">Email Address</label>
          <input type="email" class="form-control bg-light" [value]="user.email" disabled>
        </div>

        <div class="col-md-6">
          <label class="form-label small fw-bold">Department</label>
          <select class="form-select" [(ngModel)]="user.department" name="department">
            <option value="Marketing">Marketing</option>
            <option value="Finance">Finance</option>
            <option value="IT">IT</option>
            <option value="HR">HR</option>
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label small fw-bold">User ID</label>
          <input type="text" class="form-control bg-light" [value]="user.userID" disabled>
        </div>

        <div class="col-12 py-2">
           <hr class="text-muted opacity-25">
           <h6 class="fw-bold mb-3"><i class="bi bi-shield-lock me-2 text-secondary"></i>Security Settings</h6>
        </div>

        <div class="col-md-6">
          <label class="form-label small fw-bold">New Password</label>
          <div class="input-group shadow-sm">
            <input [type]="showPassword ? 'text' : 'password'" class="form-control border-end-0" [(ngModel)]="user.password" name="password" placeholder="••••••••">
            <button class="btn btn-outline-secondary border-start-0 bg-white text-muted" type="button" (click)="togglePassword()">
              <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
            </button>
          </div>
        </div>

        <div class="col-md-6">
          <label class="form-label small fw-bold">Confirm Password</label>
          <div class="input-group shadow-sm">
            <input [type]="showConfirmPassword ? 'text' : 'password'" class="form-control border-end-0" [(ngModel)]="user.confirmPassword" name="confirmPassword" placeholder="••••••••">
            <button class="btn btn-outline-secondary border-start-0 bg-white text-muted" type="button" (click)="toggleConfirmPassword()">
              <i class="bi" [ngClass]="showConfirmPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
            </button>
          </div>
        </div>

        <div class="col-12 mt-5 text-end">
          <button type="submit" class="btn btn-primary px-5 py-2 fw-bold shadow-sm rounded-pill">
            Update Profile
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
