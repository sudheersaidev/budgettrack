<div class="card border-0 shadow-sm">
  <div class="card-header bg-white py-3">
    <h6 class="mb-0 fw-bold text-primary">
      <i class="bi bi-clock-history me-2"></i>Recent Activity
    </h6>
  </div>

  <ul class="list-group list-group-flush">
    <li *ngIf="notifications.length === 0" class="list-group-item text-center py-5">
      <p class="text-muted mb-0">No recent notifications.</p>
    </li>

    <li *ngFor="let note of notifications" class="list-group-item py-3">
      <div class="d-flex justify-content-between align-items-start">
        <div class="d-flex gap-3">
          <div class="rounded-circle d-flex align-items-center justify-content-center"
               [ngClass]="note.type === 'Expense' ? 'bg-info-subtle text-info' : 'bg-primary-subtle text-primary'"
               style="width: 40px; height: 40px; flex-shrink: 0;">
            <i [class]="note.type === 'Expense' ? 'bi bi-file-earmark-text' : 'bi bi-graph-up-arrow'"></i>
          </div>

          <div>
            <div class="fw-bold text-dark">{{ note.message }}</div>
            <div class="d-flex align-items-center flex-wrap gap-2 mt-1">
              <small class="text-muted"><i class="bi bi-calendar3 me-1"></i>{{ note.date | date:'dd MMM yyyy' }}</small>
              <span class="text-muted small">|</span>
              <small class="text-muted">ID: {{ note.budgetId }}</small>
              
              <span class="badge bg-light text-dark border ms-1" style="font-size: 0.7rem;">
                <i class="bi bi-building me-1"></i>{{ note.department }}
              </span>
            </div>
          </div>
        </div>

        <span class="badge rounded-pill px-3 py-2" 
              [ngClass]="getStatusClass(note.status)"
              [style.cursor]="note.status.toUpperCase() === 'REJECTED' ? 'pointer' : 'default'"
              (click)="note.status.toUpperCase() === 'REJECTED' ? showRejectedReason(note) : null"
              [title]="note.status.toUpperCase() === 'REJECTED' ? 'Click to see reason' : ''">
          {{ note.status }}
          <i *ngIf="note.status.toUpperCase() === 'REJECTED'" class="bi bi-info-circle ms-1"></i>
        </span>
      </div>
    </li>
  </ul>
</div>
