<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-bell-fill me-2 text-primary"></i>Admin Notifications</h2>
    <button *ngIf="notifications.length > 0" 
            (click)="clearNotifications()" 
            class="btn btn-outline-danger btn-sm">
      Clear All
    </button>
  </div>

  <div *ngIf="notifications.length === 0" class="alert alert-info shadow-sm">
    <i class="bi bi-info-circle me-2"></i> No new notifications at this time.
  </div>

  <div class="list-group shadow-sm">
    <div *ngFor="let n of notifications" 
         class="list-group-item list-group-item-action d-flex align-items-center">
      <div class="flex-shrink-0">
        <span class="badge rounded-pill" 
              [ngClass]="n.type === 'user' ? 'bg-primary' : 'bg-success'">
          <i [class]="getIcon(n.type)"></i>
        </span>
      </div>
      <div class="flex-grow-1 ms-3">
        <div class="d-flex w-100 justify-content-between">
          <h6 class="mb-1 text-dark">{{ n.message }}</h6>
          <small class="text-muted">{{ n.timestamp | date:'shortTime' }}</small>
        </div>
        <small class="text-secondary">{{ n.timestamp | date:'mediumDate' }} • Type: {{ n.type | titlecase }}</small>
      </div>
    </div>
  </div>
</div>
