<div class="edit-profile-container">
  <form [formGroup]="profileForm" (ngSubmit)="onUpdate()">
    
    <div class="section-header mb-4">
      <h3 class="section-title">
        <i class="bi bi-person-circle me-2"></i>Edit Account Details
      </h3>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Full Name</label>
        <input 
          type="text" 
          formControlName="name" 
          class="form-control" 
          placeholder="Enter full name">
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Email Address</label>
        <input 
          type="email" 
          formControlName="email" 
          class="form-control disabled-input" 
          readonly>
      </div>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">User ID</label>
        <input 
          type="text" 
          formControlName="userID" 
          class="form-control disabled-input" 
          readonly>
      </div>
    </div>

    <hr class="my-4 shadow-sm">

    <div class="section-header mb-4">
      <h3 class="section-title">
        <i class="bi bi-shield-lock me-2"></i>Security Settings
      </h3>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">New Password</label>
        <div class="input-group password-toggle-group">
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            formControlName="password" 
            class="form-control hide-browser-reveal" 
            placeholder="Enter new password">
          <button 
            type="button"
            class="input-group-text bg-white cursor-pointer" 
            (click)="togglePasswordVisibility()">
            <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Confirm Password</label>
        <div class="input-group password-toggle-group">
          <input 
            [type]="showConfirmPassword ? 'text' : 'password'" 
            formControlName="confirmPassword" 
            class="form-control hide-browser-reveal" 
            placeholder="Confirm new password">
          <button 
            type="button"
            class="input-group-text bg-white cursor-pointer" 
            (click)="toggleConfirmPasswordVisibility()">
            <i class="bi" [ngClass]="showConfirmPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-end mt-4">
      <button 
        type="submit" 
        class="btn btn-primary update-btn px-5 py-2 rounded-pill shadow-sm"
        [disabled]="profileForm.invalid">
        Update Profile
      </button>
    </div>
  </form>
</div>
